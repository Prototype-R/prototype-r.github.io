<!DOCTYPE html>
<html>
<head>
  <title>Leaflet OSM Bars with Heatmap</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css" />
  <style>
    #map { height: 600px; }
  </style>
</head>
<body>

<div id="map"></div>

<!-- Leaflet JS -->
<script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

<!-- Leaflet.heat plugin -->
<script src="https://unpkg.com/leaflet.heat/dist/leaflet-heat.js"></script>

<script>
  // Initialize map
  const map = L.map('map').setView([25.105497, 121.597366], 13);

  // Base tile layer
  const baseLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap contributors'
  }).addTo(map);

  // Overlay layer containers
  let markerLayer = null;
  let heatLayer = null;

  // Load GeoJSON data
  fetch('data/bars.geojson')
    .then(response => response.json())
    .then(geojsonData => {
      // 1. Create marker layer
      markerLayer = L.geoJSON(geojsonData, {
        pointToLayer: function(feature, latlng) {
          return L.marker(latlng);
        },
onEachFeature: function(feature, layer) {
  const props = feature.properties;
  let title = 'Unnamed Bar';
  const fallbackNames = [];

  // Find the best name
  if (props) {
    if (props['name:en']) {
      title = props['name:en'];
    } else if (props['name']) {
      title = props['name'];
    } else if (props['name:zh']) {
      title = props['name:zh'];
    } else {
      // Search for any other name:* key
      for (let key in props) {
        if (key.startsWith('name:')) {
          fallbackNames.push(props[key]);
        }
      }
      if (fallbackNames.length > 0) {
        title = fallbackNames[0]; // Just pick the first alternative
      }
    }
  }

  // Build popup content
  let popupContent = `<h4>${title}</h4><hr>`;
  for (let key in props) {
    if (
      key !== '@id' &&
      !key.startsWith('name')
    ) {
      popupContent += `<strong>${key}</strong>: ${props[key]}<br>`;
    }
  }

  layer.bindPopup(popupContent);
}
      }).addTo(map);

      // 2. Create heatmap layer
      const heatData = geojsonToHeatArray(geojsonData);
      heatLayer = L.heatLayer(heatData, {
        radius: 45,
        blur: 55,
        maxZoom: 17,
      }).addTo(map);

      // 3. Add layer controls (exclude base layer)
      const overlays = {
        "Bar Markers": markerLayer,
        "Bar Heatmap": heatLayer
      };
      L.control.layers(null, overlays, { collapsed: false }).addTo(map);
    })
    .catch(error => {
      console.error('Error loading GeoJSON:', error);
    });

  // Convert GeoJSON Points to heatmap [lat, lng, intensity]
  function geojsonToHeatArray(geojson) {
    const heatArray = [];

    geojson.features.forEach(feature => {
      if (feature.geometry && feature.geometry.type === "Point") {
        const coords = feature.geometry.coordinates;
        const lat = coords[1];
        const lng = coords[0];
        heatArray.push([lat, lng, 1]); // Replace 1 with custom weight if needed
      }
    });

    return heatArray;
  }
</script>

</body>
</html>
